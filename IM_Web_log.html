<!DOCTYPE html> 
<html lang = "eng"> 
    <head> 
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Inventory Log</title>
        <link rel="stylesheet" href="IM_Style.css">
    </head>
    <body>
        <header class="page-header">
            <p>INVENTORY / ACTIVITY</p>
            <h1>Inventory log</h1>
            <p>Filter and inspect changes recorded by the inventory service.</p>
        </header>
        <main class="panel">
        
        <h4>Sort By: </h4>
        <input type = "radio" name = "filter" value = "Recent">RECENT</br>
        <input type = "radio" name = "filter" value = "Material">MATERIAL</br>
        <input type="radio" name="filter" value="Project"> PROJECT</br>
        <!-- Develop button later based off of Project Allocation-->
        <div id ="orderOptions" class = "hidden">
            <h4>Ordering</h4>
            <label><input type = "radio" name = "order" value = "Ascending"> ASCENDING </label>
            <label><input type = "radio" name = "order" value = "Descending"> DESCENDING </label>
            <label><input type = "radio" name = "order" value = "Arbitrary"> SCRAMBLE </label>
        </div>

        <div id="itemOptions" class="hidden">
            <h4>Item Options</h4>
            <label><input type="radio" name="itemType" value="All"> All </label>
            <label><input type="radio" name="itemType" value="Specific"> Specific </label>

            <!-- Search Box -->
            <div id="itemSearch" class="hidden">
                <input type="text" id = "log_search" placeholder="Search for an item...">
            </div>
        </div>
        <button id = "go">GO </button>
        <a href= "IM_Web.html"> <button id = 'addBtn'> Return Home </button> </a> 
        <!--NOTE: No Element Type Can Be After the Script, Or the Element Status Will Be Null-->
        <div class="table-wrap"><table id = "infographic" class="data-table"></table></div>
        </main>
        <footer class="page-footer"><a href="IM_Web.html">Return home</a></footer>
        <script src="IM_Config.js"></script>
        <script src = "IM_Logger.js"></script> 
    </body>
</html>
